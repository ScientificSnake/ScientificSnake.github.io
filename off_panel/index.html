<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | Page Not Found</title>
    <style>
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            background: #f8f9fa;
            color: #002855;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            padding: 2rem;
        }

        h1 {
            margin: 0;
            color: #f2a900;
            font-size: clamp(5rem, 20vw, 9rem);
            line-height: 1;
        }

        p {
            margin: 1rem 0 1.5rem;
            color: #4b5563;
        }

        a {
            color: #002855;
            font-weight: 700;
        }

        .test-page-button {
            position: fixed;
            bottom: 18%;
            left: 18%;
            width: 1.25rem;
            height: 1.25rem;
            padding: 0;
            border: 1px solid #e8e3d8;
            border-radius: 2px;
            background: #f5f2e9;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>Sorry, this page could not be found.</p>
        <a href="../">Return to the homepage</a>
    </main>
    <button id="test-page-button" class="test-page-button" type="button" aria-label="Open test page"></button>
    <script>
        document.getElementById('test-page-button').addEventListener('click', () => {
            window.location.href = '../test_page/';
        });
    </script>
</body>
</html>
